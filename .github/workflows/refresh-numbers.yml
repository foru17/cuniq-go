# 手动刷新两个站点的号池缓存 —— 应急按钮，不是主定时器。
#
# 主定时器在 sjc 服务器上（每 15 分钟）：
#   cuniq  宝塔面板计划任务 /www/server/cron/d3dbc997ddef443082f39fb781a79f0d
#   cmhk   /etc/cron.d/cmhk-update-numbers
# 这里不挂 schedule：GitHub 的 cron 会延迟，且公开仓库 60 天无提交就会自动
# 停用定时工作流；两套调度同时跑还会白白翻倍打上游。
# Vercel Cron 也用不了 —— zuoluotv team 是 Hobby 计划，每天只触发一次。
name: Refresh number pools

on:
  workflow_dispatch:

concurrency:
  group: refresh-numbers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: cuniq
            url: https://cuniq.zuoluo.tv/api/update-numbers
            secret: CUNIQ_UPDATE_API_TOKEN
          - site: cmhk
            url: https://cmhk.zuoluo.tv/api/update-numbers
            secret: CMHK_UPDATE_API_TOKEN
    steps:
      - name: Trigger ${{ matrix.site }} update
        env:
          TOKEN: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::${{ matrix.secret }} is not configured"
            exit 1
          fi

          body=$(mktemp)
          status=$(curl -sS --max-time 120 -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "${{ matrix.url }}")

          echo "HTTP $status"
          # 响应里只有统计数字，没有号码明细，可以安全打进日志
          cat "$body"
          echo

          if [ "$status" != "200" ]; then
            echo "::error::${{ matrix.site }} update failed with HTTP $status"
            exit 1
          fi
